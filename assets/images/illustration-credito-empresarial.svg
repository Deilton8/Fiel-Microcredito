<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="ce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f1e4" />
      <stop offset="100%" stop-color="#ecdbb2" />
    </linearGradient>
    <radialGradient id="ce-glow" cx="85%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ce-note1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a24b" />
      <stop offset="100%" stop-color="#ad8639" />
    </linearGradient>
    <linearGradient id="ce-note2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d18a" />
      <stop offset="100%" stop-color="#d9bb6c" />
    </linearGradient>
    <linearGradient id="ce-note3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2e3b8" />
      <stop offset="100%" stop-color="#e8d18a" />
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#ce-bg)" />
  <rect width="480" height="300" fill="url(#ce-glow)" />

  <!-- linha de crescimento, sugerindo evolução do negócio -->
  <path d="M40 190 C 120 160, 160 205, 220 150 S 340 90, 430 70" fill="none" stroke="#8a6a2c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 10" opacity="0.55" />
  <path d="M415 75 L 430 70 L 421 84" fill="none" stroke="#8a6a2c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />

  <!-- moedas empilhadas -->
  <g stroke="#0f1f3d" stroke-width="2">
    <ellipse cx="97" cy="221" rx="34" ry="11" fill="#16294f" />
    <ellipse cx="97" cy="209" rx="34" ry="11" fill="#0f1f3d" />
    <ellipse cx="97" cy="197" rx="34" ry="11" fill="#16294f" />
    <ellipse cx="97" cy="185" rx="34" ry="11" fill="#0f1f3d" />
  </g>
  <ellipse cx="97" cy="185" rx="34" ry="11" fill="none" stroke="#d9bb6c" stroke-width="1.5" opacity="0.8" />

  <!-- leque de 3 notas abstractas (sem retrato nem texto: montante genérico) -->
  <g transform="translate(255,178) rotate(-14)">
    <rect x="-72" y="-45" width="144" height="90" rx="10" fill="url(#ce-note1)" stroke="#7a5d28" stroke-width="1.5" />
  </g>
  <g transform="translate(272,172) rotate(-2)">
    <rect x="-72" y="-45" width="144" height="90" rx="10" fill="url(#ce-note2)" stroke="#8a6a2c" stroke-width="1.5" />
    <circle cx="0" cy="0" r="21" fill="none" stroke="#8a6a2c" stroke-width="1.5" opacity="0.6" />
    <line x1="-50" y1="-28" x2="-28" y2="-28" stroke="#8a6a2c" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <line x1="28" y1="28" x2="50" y2="28" stroke="#8a6a2c" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  </g>
  <g transform="translate(292,166) rotate(11)">
    <rect x="-72" y="-45" width="144" height="90" rx="10" fill="url(#ce-note3)" stroke="#ad8639" stroke-width="1.5" />
    <circle cx="0" cy="0" r="21" fill="none" stroke="#ad8639" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- base / balcão, sugerindo um pequeno negócio -->
  <rect x="0" y="256" width="480" height="44" fill="#0f1f3d" opacity="0.08" />
  <rect x="0" y="256" width="480" height="3" fill="#0f1f3d" opacity="0.18" />
</svg>
